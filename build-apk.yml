name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create debug keystore (the project expects ./debug.keystore)
        run: |
          [ -f debug.keystore ] || keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Create placeholder google-services.json if missing
        run: |
          if [ ! -f app/google-services.json ]; then
          python3 - <<'PY'
          import json
          pkg = "com.example"
          json.dump({"project_info":{"project_number":"1","project_id":"kestrel-local","storage_bucket":"kestrel-local.appspot.com"},
            "client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":pkg}},
            "oauth_client":[],"api_key":[{"current_key":"x"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
            "configuration_version":"1"}, open("app/google-services.json","w"))
          PY
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
